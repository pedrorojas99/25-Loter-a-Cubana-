# Build trigger: public users APK (debug) for 25 Lotería Cubana.
name: Android build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run public app unit tests
        run: gradle testUsuariosDebugUnitTest
      - name: Build public users APK
        run: gradle assembleUsuariosDebug
      - name: Upload users APK
        uses: actions/upload-artifact@v4
        with:
          name: 25-loteria-cubana-usuarios
          path: app/build/outputs/apk/usuarios/debug/*.apk
