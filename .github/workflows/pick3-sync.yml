name: Florida Lottery Pick 3 history sync

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pick3-sync.yml'
      - 'scripts/import_pick3_history.py'
  schedule:
    - cron: "15 19 * * *"
    - cron: "15 3 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: florida-pick3-history-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Extract and validate official PDF rows
        run: |
          python -m pip install --disable-pip-version-check "pdfplumber==0.11.7" "requests==2.32.5"
          python scripts/import_pick3_history.py

      - name: Request GitHub OIDC token
        shell: bash
        run: |
          TOKEN_JSON=$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=25-loteria-pick3")
          TOKEN=$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$TOKEN_JSON")
          echo "::add-mask::$TOKEN"
          echo "PICK3_OIDC_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Import official history into Supabase
        env:
          OIDC_TOKEN: ${{ env.PICK3_OIDC_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, requests
          with open("pick3_payload.json", encoding="utf-8") as f:
              payload = json.load(f)
          response = requests.post(
              "https://pnnujsvixsglydhafzih.supabase.co/functions/v1/sync-pick3-history",
              json=payload,
              headers={
                  "Authorization": "Bearer " + os.environ["OIDC_TOKEN"],
                  "Content-Type": "application/json"
              },
              timeout=180
          )
          print("Supabase import response:", response.status_code, response.text[:2000])
          response.raise_for_status()
          result = response.json()
          if result.get("status") != "success":
              raise SystemExit("Supabase did not confirm a successful import")
          if result.get("rows_upserted") != len(payload["rows"]):
              raise SystemExit("Supabase row count differs from validated PDF row count")
          PY
