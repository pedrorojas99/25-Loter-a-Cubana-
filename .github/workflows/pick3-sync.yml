name: Florida Lottery Pick 3 history sync

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pick3-sync.yml'
      - 'scripts/import_pick3_history.py'
  schedule:
    - cron: "15 19 * * *"
    - cron: "15 3 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: florida-pick3-history-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Request GitHub OIDC token
        shell: bash
        run: |
          TOKEN_JSON=$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "\${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=25-loteria-pick3")
          TOKEN=$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$TOKEN_JSON")
          echo "::add-mask::$TOKEN"
          echo "PICK3_OIDC_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Sync official history directly from Supabase
        env:
          OIDC_TOKEN: \${{ env.PICK3_OIDC_TOKEN }}
        shell: bash
        run: |
          curl -fsS \
            -X POST "https://pnnujsvixsglydhafzih.supabase.co/functions/v1/sync-pick3-history" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"refresh_official":true}' \
            -o sync-result.json
          cat sync-result.json
          python - <<'PY'
          import json
          with open("sync-result.json", encoding="utf-8") as f:
              result = json.load(f)
          if result.get("status") != "success":
              raise SystemExit("Supabase did not confirm a successful official history sync")
          if result.get("rows_upserted") != result.get("draws_found"):
              raise SystemExit("Supabase upsert count differs from parsed official rows")
          if result.get("draws_found", 0) < 1300:
              raise SystemExit("Official history coverage is below the required minimum")
          PY
